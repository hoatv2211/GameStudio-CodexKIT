name: behavioral-and-tier-b-preflight

'on':
  workflow_dispatch:
    inputs:
      enforce_release_readiness:
        description: Fail unless every governed lifecycle signal is a verified PASS.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 19 * * *'

jobs:
  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Export behavioral cases
        if: always()
        run: python scripts/behavior_eval.py . --export behavior-cases.jsonl
      - name: Record behavioral BLOCKED status without governed runner results
        if: always()
        shell: bash
        run: |
          status=0
          python scripts/behavior_eval.py . --status behavior-status.json || status=$?
          echo "$status" > behavior-status.exit-code
      - name: Export pressure cases
        if: always()
        run: python scripts/pressure_eval.py . --export pressure-cases.jsonl
      - name: Record pressure BLOCKED status without governed runner results
        if: always()
        shell: bash
        run: |
          status=0
          python scripts/pressure_eval.py . --status pressure-status.json || status=$?
          echo "$status" > pressure-status.exit-code
      - name: Export Tier-B cases
        if: always()
        run: python scripts/tier_b_eval.py . --export tier-b-cases.jsonl
      - name: Record explicit BLOCKED status without Hermes judge
        if: always()
        shell: bash
        run: |
          status=0
          python scripts/tier_b_eval.py . --status tier-b-status.json || status=$?
          echo "$status" > tier-b-status.exit-code
      - name: Export real-project dogfood cases
        if: always()
        run: python scripts/dogfood_eval.py . --export dogfood-cases.jsonl
      - name: Record dogfood BLOCKED status without a live project runner
        if: always()
        shell: bash
        run: |
          status=0
          python scripts/dogfood_eval.py . --status dogfood-status.json || status=$?
          echo "$status" > dogfood-status.exit-code
      - name: Record originality lifecycle status
        if: always()
        shell: bash
        run: |
          status=0
          python -B scripts/check_originality.py . > originality-report.json || status=$?
          echo "$status" > originality-report.exit-code
      - name: Record catalog lifecycle status
        if: always()
        shell: bash
        run: |
          status=0
          python -B scripts/catalog_audit.py . --output catalog-audit.json > catalog-audit.stdout.json || status=$?
          echo "$status" > catalog-audit.exit-code
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("catalog-audit.json").read_text(encoding="utf-8"))
          Path("session-history-status.json").write_text(
              json.dumps(catalog["session_history"], indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate lifecycle artifact completeness and scheduled verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          status_reports = (
              "behavior-status.json",
              "pressure-status.json",
              "tier-b-status.json",
              "dogfood-status.json",
              "originality-report.json",
              "catalog-audit.json",
              "session-history-status.json",
          )
          support_artifacts = (
              "behavior-cases.jsonl",
              "pressure-cases.jsonl",
              "tier-b-cases.jsonl",
              "dogfood-cases.jsonl",
              "catalog-audit.stdout.json",
          )
          expected = status_reports + support_artifacts
          missing = [name for name in expected if not Path(name).is_file()]
          blocked = []
          failed = []
          for name in status_reports:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  failed.append(f"{name}=invalid:{error}")
                  continue
              status = payload.get("status", payload.get("verdict"))
              if status == "BLOCKED":
                  blocked.append(f"{name}=BLOCKED")
              elif status != "PASS":
                  failed.append(f"{name}={status}")
          verdict = "FAIL" if missing or failed else "BLOCKED" if blocked else "PASS"
          report = {
              "status": verdict,
              "missing": missing,
              "blocked": blocked,
              "failed": failed,
              "reports": list(status_reports),
          }
          Path("lifecycle-verdict.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          if verdict == "FAIL":
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governed-runner-preflight
          path: |
            behavior-cases.jsonl
            behavior-status.json
            pressure-cases.jsonl
            pressure-status.json
            tier-b-cases.jsonl
            tier-b-status.json
            dogfood-cases.jsonl
            dogfood-status.json
            originality-report.json
            catalog-audit.json
            catalog-audit.stdout.json
            session-history-status.json
            lifecycle-verdict.json

  release-readiness:
    needs: offline-evals
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.enforce_release_readiness }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: governed-runner-preflight
          path: readiness
      - name: Enforce governed release readiness
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          reports = (
              "behavior-status.json",
              "pressure-status.json",
              "tier-b-status.json",
              "dogfood-status.json",
              "originality-report.json",
              "catalog-audit.json",
              "session-history-status.json",
          )
          blocked = []
          failed = []
          for name in reports:
              path = Path("readiness") / name
              if not path.is_file():
                  failed.append(f"{name}=MISSING")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              status = payload.get("status", payload.get("verdict"))
              if status != "PASS":
                  target = blocked if status == "BLOCKED" else failed
                  target.append(f"{name}={status}")
          if blocked or failed:
              print(json.dumps({"blocked": blocked, "failed": failed}, indent=2))
              sys.exit(2 if blocked else 1)
          print(json.dumps({"status": "PASS", "reports": list(reports)}, indent=2))
          PY

  tier-b-contract:
    if: ${{ false }} # Enable only on a self-hosted runner with an authenticated Hermes model judge.
    runs-on: self-hosted
    steps:
      - run: echo 'BLOCKED until a governed Hermes judge command is configured; never fabricate PASS.'
