<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MOStudio Kit — Agent skills for operating live game projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0e1729"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f6ff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- routing lines (left, subtle) -->
  <g stroke="#164e63" stroke-width="2" fill="none" opacity="0.8">
    <path d="M60 160 H150 Q170 160 178 143 L196 108 Q204 92 224 92 H300"/>
    <path d="M60 160 H150 Q170 160 178 177 L196 212 Q204 228 224 228 H300"/>
    <path d="M60 160 H300" opacity="0.6"/>
  </g>
  <circle cx="60" cy="160" r="7" fill="#22d3ee"/>
  <circle cx="300" cy="92" r="5" fill="#34d399"/>
  <circle cx="300" cy="160" r="5" fill="#34d399"/>
  <circle cx="300" cy="228" r="5" fill="#fbbf24"/>

  <!-- maturity badge -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect x="562" y="54" width="156" height="28" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="640" y="73" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.8" fill="#93c5fd">BETA CATALOG</text>
  </g>

  <!-- title -->
  <text x="640" y="132" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#title)">MOStudio Kit</text>
  <text x="640" y="176" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Agent skills for operating live game projects — not writing new ones</text>

  <!-- catalog stat chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <g>
      <rect x="272" y="208" width="152" height="34" rx="17" fill="#0f2536" stroke="#155e75" stroke-width="1.5"/>
      <text x="348" y="230" text-anchor="middle" fill="#67e8f9">47 SKILLS</text>
    </g>
    <g>
      <rect x="438" y="208" width="152" height="34" rx="17" fill="#10273a" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="514" y="230" text-anchor="middle" fill="#93c5fd">22 AGENTS</text>
    </g>
    <g>
      <rect x="604" y="208" width="136" height="34" rx="17" fill="#0f2b22" stroke="#166534" stroke-width="1.5"/>
      <text x="672" y="230" text-anchor="middle" fill="#6ee7b7">7 PACKS</text>
    </g>
    <g>
      <rect x="754" y="208" width="198" height="34" rx="17" fill="#2b2410" stroke="#854d0e" stroke-width="1.5"/>
      <text x="853" y="230" text-anchor="middle" fill="#fcd34d">ROUTING 276/276</text>
    </g>
  </g>

  <!-- evidence terminal card (right) -->
  <g transform="translate(985,54)">
    <rect x="0" y="0" width="240" height="130" rx="10" fill="#0a0f1a" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="4" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4" fill="#22c55e"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="16" y="48" fill="#4ade80">&#10003; Verified  exit 0</text>
      <text x="16" y="72" fill="#4ade80">&#10003; Verified  32/32 IDs</text>
      <text x="16" y="96" fill="#fbbf24">&#9888; BLOCKED  not faked</text>
      <text x="16" y="118" fill="#64748b">$ evidence &gt; confidence</text>
    </g>
  </g>

  <!-- pixel controller (bottom left corner accent) -->
  <g transform="translate(40,246)" fill="#1d4ed8" opacity="0.9">
    <rect x="0" y="8" width="52" height="24" rx="8" fill="#173764"/>
    <rect x="8" y="14" width="12" height="4" fill="#38bdf8"/>
    <rect x="12" y="10" width="4" height="12" fill="#38bdf8"/>
    <circle cx="38" cy="14" r="2.6" fill="#f472b6"/>
    <circle cx="44" cy="20" r="2.6" fill="#34d399"/>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="314" width="1280" height="6" fill="#0891b2" opacity="0.7"/>
</svg>
